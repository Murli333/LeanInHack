<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05080F" id="theme-color-meta" />
    <meta name="description" content="ScamLens — Detect the scam. Understand the risk. Stay protected." />
    <title>ScamLens — AI Scam & Threat Detection</title>

    <!-- Preconnect to Google Fonts for Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Inline pre-paint script to prevent theme flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('scamlens-theme');
          var theme = 'dark';
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else {
            // 'system' or default
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#05080F' : '#F5F7FB');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-text antialiased min-h-screen selection:bg-primary/20 selection:text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
