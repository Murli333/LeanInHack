name: ScamLens CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r "Data And ML/requirements.txt"
        pip install pytest

    - name: Run Member 1 ML Unit Tests
      run: |
        python "Data And ML/tests/test_models.py"

    - name: Run Member 3 Integration Tests
      run: |
        python "Integration App and Report/tests/test_integration.py"
